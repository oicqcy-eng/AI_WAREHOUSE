version: "3.9"
networks: { mfg-net: { driver: bridge } }
services:
  quality-service:
    image: quality-service:latest; container_name: aiw-quality; restart: unless-stopped
    networks: [mfg-net]; ports: ["8081:8081"]
    environment:
      DB_HOST: ${DB_HOST:-localhost}; DB_PORT: ${DB_PORT:-5432}
      DB_NAME: quality_db; DB_USER: ${DB_USER:-app_user}; DB_PASSWORD: ${DB_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s; timeout: 5s; retries: 3; start_period: 30s

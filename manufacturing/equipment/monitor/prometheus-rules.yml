groups:
  - name: equipment
    rules:
      - alert: EquipmentDown
        expr: up{service="equipment-service"} == 0; for: 1m
        labels: { severity: critical, module: equipment }
        annotations: { summary: "设备管理服务宕机" }
      - alert: MaintenanceOverdue
        expr: equipment_maintenance_overdue_count > 3; for: 1h
        labels: { severity: warning, module: equipment }
        annotations: { summary: "保养超期 ({{ $value }} 台)" }
      - alert: OEEBelowThreshold
        expr: equipment_oee_avg < 60; for: 24h
        labels: { severity: warning, module: equipment }
        annotations: { summary: "综合 OEE 低于 60%" }

version: "3.9"
networks: { mfg-net: { driver: bridge } }
services:
  warehouse-service:
    image: warehouse-service:latest; container_name: aiw-warehouse; restart: unless-stopped
    networks: [mfg-net]; ports: ["8072:8072"]
    environment:
      DB_HOST: ${DB_HOST:-localhost}; DB_PORT: ${DB_PORT:-5432}
      DB_NAME: warehouse_db; DB_USER: ${DB_USER:-app_user}; DB_PASSWORD: ${DB_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8072/health"]
      interval: 30s; timeout: 5s; retries: 3; start_period: 30s

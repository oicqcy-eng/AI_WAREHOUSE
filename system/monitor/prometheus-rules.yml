groups:
  - name: system
    interval: 30s
    rules:
      - alert: SystemServiceDown
        expr: up{service="system-service"} == 0
        for: 1m
        labels:
          severity: critical
          module: system
        annotations:
          summary: "系统配置服务宕机"

      - alert: LoginFailureRate
        expr: rate(system_login_failures_total[5m]) > 20
        for: 5m
        labels:
          severity: warning
          module: system
        annotations:
          summary: "登录失败率过高 ({{ $value }}/s)"
          description: "可能存在暴力破解尝试"

      - alert: AuditLogQueueBacklog
        expr: audit_log_queue_backlog > 10000
        for: 15m
        labels:
          severity: warning
          module: system
        annotations:
          summary: "审计日志队列积压 ({{ $value }})"
          description: "审计日志未处理数 {{ $value }}，超过 10000 阈值"

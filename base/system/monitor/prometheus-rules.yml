groups:
  - name: system
    interval: 30s
    rules:
      - alert: SystemServiceDown
        expr: up{service="system-service"} == 0
        for: 1m; labels: { severity: critical, module: system }
        annotations: { summary: "系统管理服务宕机" }
      - alert: LoginFailureRate
        expr: rate(system_login_failures_total[5m]) > 20
        for: 5m; labels: { severity: warning, module: system }
        annotations: { summary: "登录失败率过高，可能存在暴力破解" }

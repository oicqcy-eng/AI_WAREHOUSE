# ============================================
# AI-WAREHOUSE — Nginx 主配置
# ============================================
# 统一 API 网关，路由到 AI 服务和制造服务
# ============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── 日志格式 ──
    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":$upstream_status,'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';
    access_log /var/log/nginx/access.log json;

    # ── 基础优化 ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    client_max_body_size 100m;
    server_tokens off;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript image/svg+xml;

    # ── SSL ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 上游后端 ──
    upstream ai-api {
        server vllm:8000 max_fails=3 fail_timeout=30s;
    }

    upstream triton-api {
        server triton:8001 max_fails=3 fail_timeout=30s;
    }

    # ── 虚拟主机 ──
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.ai-warehouse.local;

        ssl_certificate /etc/nginx/ssl/certs/ai-warehouse.crt;
        ssl_certificate_key /etc/nginx/ssl/private/ai-warehouse.key;

        # ── AI API 路由 ──
        location /v1/ {
            proxy_pass http://ai-api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /triton/ {
            proxy_pass http://triton-api/;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # ── 健康检查 ──
        location /health {
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        location /metrics {
            deny all;
            return 403;
        }
    }
}

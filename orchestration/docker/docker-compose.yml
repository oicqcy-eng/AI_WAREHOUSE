# ============================================
# AI-WAREHOUSE — 全栈编排（AI + 制造 + 基础）
# ============================================
# 使用方式：
#   docker compose up -d                           # 启动全部
#   docker compose -f docker-compose.ai.yml up -d  # 仅 AI 服务
#   docker compose -f docker-compose.monitor.yml up -d  # 仅监控
# ============================================

version: "3.9"

networks:
  ai-warehouse-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  redis-data:
  milvus-data:
  minio-data:
  grafana-data:
  prometheus-data:
  loki-data:

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:

  # ──────────── 数据库 ────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-warehouse-pg
    restart: unless-stopped
    networks:
      - ai-warehouse-net
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../database/postgresql/migrations:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ai_warehouse
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: ai-warehouse-redis
    restart: unless-stopped
    networks:
      - ai-warehouse-net
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change_me}
    logging: *default-logging

  # ──────────── 对象存储 ────────────
  minio:
    image: minio/minio:latest
    container_name: ai-warehouse-minio
    restart: unless-stopped
    networks:
      - ai-warehouse-net
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-change_me}
    command: server /data --console-address ":9001"
    logging: *default-logging

  # ──────────── AI 平台 ────────────
  # 详细 AI 服务见 docker-compose.ai.yml
  # ──────────── 监控 ────────────────
  # 详细监控服务见 docker-compose.monitor.yml

  # ──────────── API 网关 ────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ai-warehouse-nginx
    restart: unless-stopped
    networks:
      - ai-warehouse-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../security/ssl:/etc/nginx/ssl:ro
    depends_on:
      - postgres
      - redis
    logging: *default-logging

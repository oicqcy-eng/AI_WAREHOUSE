# ============================================
# AI 推理 — 部署配置
# ============================================
version: "3.9"

networks:
  ai-net:
    driver: bridge

volumes:
  model-cache:

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: aiw-vllm
    restart: unless-stopped
    networks: [ai-net]
    ports: ["8000:8000"]
    volumes:
      - model-cache:/root/.cache/huggingface
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - "--model"
      - "${MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.9"
      - "--max-model-len"
      - "8192"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  triton:
    image: nvcr.io/nvidia/tritonserver:24.08-py3
    container_name: aiw-triton
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "8001:8001"
      - "8002:8002"
    volumes:
      - ../../ai-serving/config/triton-models:/models
    command: tritonserver --model-repository=/models --http-port=8001 --grpc-port=8002
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles:
      - triton

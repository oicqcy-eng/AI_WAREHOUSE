groups:
  - name: ai-serving
    interval: 30s
    rules:
      - alert: VLLMDown
        expr: up{service="vllm"} == 0
        for: 1m
        labels:
          severity: critical
          module: ai-serving
        annotations:
          summary: "AI 推理服务宕机"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(vllm:request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          module: ai-serving
        annotations:
          summary: "推理延迟过高 (P95 > 30s)"
          description: "P95 延迟 {{ $value }}s，超过 30s 阈值"

      - alert: GPUMemoryPressure
        expr: (DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL) * 100 > 95
        for: 5m
        labels:
          severity: warning
          module: ai-serving
        annotations:
          summary: "GPU 显存压力 ({{ $value | humanizePercentage }})"

# ============================================
# AI-WAREHOUSE — Prometheus 全局配置
# ============================================
# 采集所有 AI + 制造 + 基础设施指标
# ============================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: ai-warehouse
    env: ${ENV:-dev}

# ── 告警规则 ──
rule_files:
  - "rules/*.yml"

# ── 告警通知 ──
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# ── 抓取目标 ──
scrape_configs:

  # ──── Prometheus 自身 ────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ──── 节点资源 ────
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):.*"
        replacement: "${1}"

  # ──── GPU 监控 ────
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9400"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.*):.*"
        replacement: "${1}"

  # ──── Docker 容器 ────
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service

  # ──── AI 服务 ────
  - job_name: vllm
    static_configs:
      - targets: ["vllm:8000"]
    metrics_path: /metrics

  - job_name: triton
    static_configs:
      - targets: ["triton:8002"]
    metrics_path: /metrics

  # ──── 制造服务 ────
  - job_name: manufacturing
    consul_sd_configs:
      - server: consul:8500
        services: []
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_service_id]
        target_label: service_id

  # ──── PostgreSQL ────
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # ──── Loki（日志指标） ────
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

# ============================================
# AI-WAREHOUSE — 基础设施告警规则
# ============================================

groups:
  - name: infrastructure
    interval: 30s
    rules:

      # ── 主机 ──
      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "主机 {{ $labels.instance }} 宕机"
          description: "节点 {{ $labels.instance }} 已离线超过 1 分钟"

      - alert: HighDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint="/"} / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint="/"})) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "磁盘使用率超过 85% ({{ $value | humanizePercentage }})"
          description: "节点 {{ $labels.instance }} 磁盘使用率已达 {{ $value | humanizePercentage }}"

      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用率超过 90% ({{ $value | humanizePercentage }})"
          description: "节点 {{ $labels.instance }} CPU 使用率 {{ $value | humanizePercentage }}"

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用率超过 90% ({{ $value | humanizePercentage }})"
          description: "节点 {{ $labels.instance }} 内存使用率 {{ $value | humanizePercentage }}"

      # ── Docker ──
      - alert: ContainerRestartLoop
        expr: rate(container_last_seen{container_label_com_docker_compose_service!=""}[15m]) * 60 < 5 and rate(container_start_time_seconds{container_label_com_docker_compose_service!=""}[15m]) * 60 > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "容器 {{ $labels.container_label_com_docker_compose_service }} 频繁重启"
          description: "服务 {{ $labels.container_label_com_docker_compose_service }} 在 15 分钟内重启多次"

      # ── PostgreSQL ──
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL 宕机"
          description: "数据库实例 {{ $labels.instance }} 不可用"

      - alert: PostgresHighConnections
        expr: pg_stat_activity_count{datname!~"template.*"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库连接数过多 ({{ $value }})"
          description: "数据库连接数已达 {{ $value }}，超过 100 阈值"

# ============================================
# AI-WAREHOUSE — AI 平台告警规则
# ============================================

groups:
  - name: ai-platform
    interval: 30s
    rules:

      # ── GPU ──
      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU 温度过高 ({{ $value }}°C)"
          description: "GPU {{ $labels.gpu }} 温度已达 {{ $value }}°C，超过 85°C 阈值"

      - alert: GPUUnavailable
        expr: up{job="gpu"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GPU Exporter 不可达"
          description: "GPU 监控目标 {{ $labels.instance }} 已离线"

      - alert: GPUMemoryPressure
        expr: (DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL) * 100 > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU 显存压力 ({{ $value | humanizePercentage }})"
          description: "GPU {{ $labels.gpu }} 显存使用率已达 {{ $value | humanizePercentage }}"

      # ── vLLM / LLM Serving ──
      - alert: ModelServerDown
        expr: up{job="vllm"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "模型推理服务宕机"
          description: "vLLM 服务 {{ $labels.instance }} 已离线，请立即检查"

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(vllm:request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "推理请求延迟过高 (P95 > 30s)"
          description: "模型推理 P95 延迟已达 {{ $value }}s"

      # ── Milvus ──
      - alert: MilvusDown
        expr: up{job="milvus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "向量数据库宕机"
          description: "Milvus 服务不可达"

      - alert: MilvusHighMemory
        expr: (process_resident_memory_bytes{job="milvus"} / 1073741824) > 16
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Milvus 内存过高 ({{ $value }}GB)"
          description: "Milvus 已占用 {{ $value }}GB 内存"

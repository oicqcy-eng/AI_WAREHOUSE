# ============================================
# AI-WAREHOUSE — Grafana Dashboard 自动加载配置
# ============================================
apiVersion: 1

providers:
  - name: "AI-WAREHOUSE"
    orgId: 1
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true

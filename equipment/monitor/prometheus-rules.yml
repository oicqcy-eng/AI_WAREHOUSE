groups:
  - name: equipment
    interval: 30s
    rules:
      - alert: EquipmentServiceDown
        expr: up{service="equipment-service"} == 0
        for: 1m
        labels:
          severity: critical
          module: equipment
        annotations:
          summary: "设备管理服务宕机"

      - alert: MaintenanceOverdue
        expr: equipment_maintenance_overdue_count > 3
        for: 1h
        labels:
          severity: warning
          module: equipment
        annotations:
          summary: "保养超期 ({{ $value }} 台)"
          description: "有 {{ $value }} 台设备保养计划超期未执行"

      - alert: OEEBelowThreshold
        expr: equipment_oee_avg < 60
        for: 24h
        labels:
          severity: warning
          module: equipment
        annotations:
          summary: "综合 OEE 低于 60%"
          description: "当前综合设备效率 {{ $value }}%，低于目标值 60%"

      - alert: EquipmentHighTemp
        expr: equipment_temperature_celsius > 85
        for: 5m
        labels:
          severity: warning
          module: equipment
        annotations:
          summary: "设备温度过高 ({{ $value }}°C)"
          description: "设备 {{ $labels.device_id }} 温度 {{ $value }}°C，超过阈值 85°C"

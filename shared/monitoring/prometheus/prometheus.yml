# ============================================
# AI-WAREHOUSE — Prometheus 全局配置
# ============================================
# 此为基础 Prometheus 配置，各模块的告警规则
# 存放在对应模块的 monitor/ 目录下
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ai-warehouse
    env: ${ENV:-dev}

rule_files:
  # 加载各模块的告警规则
  - ../../quality/monitor/prometheus-rules.yml
  - ../../equipment/monitor/prometheus-rules.yml
  - ../../ai-serving/monitor/prometheus-rules.yml
  - ../../gpu/monitor/prometheus-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9400"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

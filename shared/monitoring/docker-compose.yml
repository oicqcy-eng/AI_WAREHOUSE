version: "3.9"
networks: { monitor-net: { driver: bridge } }
volumes: { prometheus-data: { }, grafana-data: { }, loki-data: { } }
services:
  prometheus:
    image: prom/prometheus:v2.53; container_name: aiw-prometheus; restart: unless-stopped
    networks: [monitor-net]; ports: ["9090:9090"]
    volumes: [prometheus-data:/prometheus, ./prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
  grafana:
    image: grafana/grafana:11.1; container_name: aiw-grafana; restart: unless-stopped
    networks: [monitor-net]; ports: ["3000:3000"]
    volumes: [grafana-data:/var/lib/grafana]
    environment: { GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin} }
  loki:
    image: grafana/loki:3.1; container_name: aiw-loki; restart: unless-stopped
    networks: [monitor-net]; ports: ["3100:3100"]
    volumes: [loki-data:/loki, ./loki.yml:/etc/loki/loki.yml:ro]

# AI-WAREHOUSE — Nginx API 网关
worker_processes auto; error_log /var/log/nginx/error.log warn; pid /var/run/nginx.pid;
events { worker_connections 4096; multi_accept on; }
http {
  include /etc/nginx/mime.types; default_type application/octet-stream; server_tokens off;
  access_log /var/log/nginx/access.log; sendfile on; tcp_nopush on; keepalive_timeout 65; client_max_body_size 100m;
  # base
  upstream system { server system-service:8086; }
  upstream master-data { server master-data-service:8071; }
  # manufacturing
  upstream quality { server quality-service:8081; }
  upstream equipment { server equipment-service:8082; }
  upstream production { server production-service:8083; }
  upstream scheduling { server scheduling-service:8073; }
  # operations
  upstream kanban { server kanban-service:8074; }
  # ai
  upstream ai { server ai-serving:8000; }
  server {
    listen 443 ssl http2; server_name api.ai-warehouse.local;
    ssl_certificate /etc/nginx/ssl/ai-warehouse.crt; ssl_certificate_key /etc/nginx/ssl/ai-warehouse.key;
    location /api/v1/system/ { proxy_pass http://system/; }
    location /api/v1/master-data/ { proxy_pass http://master-data/; }
    location /api/v1/quality/ { proxy_pass http://quality/; }
    location /api/v1/equipment/ { proxy_pass http://equipment/; }
    location /api/v1/production/ { proxy_pass http://production/; }
    location /api/v1/scheduling/ { proxy_pass http://scheduling/; }
    location /api/v1/ai/ { proxy_pass http://ai/; proxy_read_timeout 300s; proxy_buffering off; }
    location /kanban/ { proxy_pass http://kanban/; }
    location /health { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }
  }
}

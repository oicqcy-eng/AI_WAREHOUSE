# ============================================
# AI-WAREHOUSE — Nginx API 网关
# ============================================
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format json escape=json '{'
        '"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"request":"$request","status":$status,'
        '"request_time":$request_time,"upstream_addr":"$upstream_addr"'
    '}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript;

    # SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # 包含各模块路由
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.ai-warehouse.local;

        ssl_certificate /etc/nginx/ssl/certs/ai-warehouse.crt;
        ssl_certificate_key /etc/nginx/ssl/private/ai-warehouse.key;

        # AI 推理路由
        location /api/v1/ai/ {
            proxy_pass http://ai-serving:8000/;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # 制造服务路由
        location /api/v1/quality/ {
            proxy_pass http://quality-service:50051/;
        }

        location /api/v1/equipment/ {
            proxy_pass http://equipment-service:50051/;
        }

        location /api/v1/production/ {
            proxy_pass http://production-service:50051/;
        }

        location /api/v1/system/ {
            proxy_pass http://system-service:50051/;
        }

        # 监控面板
        location /grafana/ {
            proxy_pass http://grafana:3000/;
        }

        location /health {
            return 200 '{"status":"ok","version":"1.0"}';
            add_header Content-Type application/json;
        }
    }
}

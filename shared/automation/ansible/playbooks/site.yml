---
- name: 初始化节点
  hosts: all
  become: yes
  tasks:
    - name: 安装基础工具
      apt:
        name: [docker.io, python3-pip, htop, iotop, tmux, jq, bc]
        state: present

    - name: 配置系统参数
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
      loop:
        - { name: net.core.somaxconn, value: "65535" }
        - { name: vm.max_map_count, value: "262144" }
        - { name: vm.swappiness, value: "10" }

    - name: 创建数据目录
      file: path=/data state=directory mode=0755

# ============================================
# AI-WAREHOUSE — Ansible 站点 Playbook
# ============================================
# 用法:
#   ansible-playbook -i inventory.yml playbooks/site.yml -l dev
# ============================================

- name: 初始化 Docker 节点
  hosts: all
  gather_facts: yes
  become: yes

  vars:
    docker_version: "24.0"
    nvidia_driver_version: "550"
    monitoring_exporter: true

  tasks:
    - name: 安装系统依赖
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - htop
          - iotop
          - net-tools
          - tmux
          - jq
          - bc
        state: present
        update_cache: yes

    - name: 安装 Docker
      include_role:
        name: docker

    - name: 安装 NVIDIA 容器工具包
      include_role:
        name: nvidia-container-toolkit
      when: "'gpu' in group_names"

    - name: 配置系统参数
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: yes
        reload: yes
      loop:
        - { name: net.core.somaxconn, value: "65535" }
        - { name: vm.max_map_count, value: "262144" }
        - { name: vm.swappiness, value: "10" }

    - name: 创建数据目录
      file:
        path: /data
        state: directory
        mode: "0755"

- name: 部署监控栈
  hosts: monitoring
  become: yes
  tasks:
    - name: 启动 Prometheus 和 Grafana
      docker_compose:
        project_src: /opt/ai-warehouse/orchestration/docker
        files:
          - docker-compose.monitor.yml
        state: present

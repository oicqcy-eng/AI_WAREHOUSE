# ============================================
# AI-WAREHOUSE — 服务器资产清单
# ============================================
# 记录所有管理节点的硬件配置与用途
# ============================================

servers:
  - hostname: ai-dev-01
    role: development
    ip: 192.168.1.101
    os: Ubuntu 22.04 LTS
    kernel: "6.5"
    cpu:
      model: Intel Xeon Gold 6438M
      cores: 16
      threads: 32
    memory: 64 GB
    disk:
      - mount: /
        size: 512 GB
        type: NVMe SSD
      - mount: /data
        size: 2 TB
        type: NVMe SSD
    gpu:
      - model: NVIDIA RTX 4090
        count: 1
        vram: 24 GB
        driver: "550.54"
    network:
      - interface: eth0
        speed: 10 Gbps
    services:
      - docker
      - postgresql
      - redis
      - milvus
    status: active
    notes: 开发环境主节点

  - hostname: ai-stg-01
    role: staging
    ip: 192.168.1.102
    os: Ubuntu 22.04 LTS
    cpu:
      model: Intel Xeon Gold 6438M
      cores: 32
      threads: 64
    memory: 128 GB
    disk:
      - mount: /
        size: 512 GB
        type: NVMe SSD
      - mount: /data
        size: 4 TB
        type: NVMe SSD
    gpu:
      - model: NVIDIA A100 40G
        count: 1
        vram: 40 GB
        driver: "550.54"
      - model: NVIDIA A100 40G
        count: 1
        vram: 40 GB
    services:
      - docker
      - kubernetes (worker)
    status: active
    notes: 预发布环境

  - hostname: ai-prod-01
    role: production
    ip: 192.168.1.201
    os: Ubuntu 22.04 LTS
    cpu:
      model: AMD EPYC 9654
      cores: 48
      threads: 96
    memory: 256 GB
    disk:
      - mount: /
        size: 1 TB
        type: NVMe SSD
      - mount: /data
        size: 8 TB
        type: NVMe SSD
    gpu:
      - model: NVIDIA A100 80G
        count: 2
        vram: 80 GB
        driver: "550.54"
    network:
      - interface: eth0
        speed: 25 Gbps
    services:
      - docker
      - kubernetes (control-plane)
      - nginx
      - postgresql
    status: active
    notes: 生产环境主节点；需要冗余电源

  - hostname: ai-prod-02
    role: production
    ip: 192.168.1.202
    os: Ubuntu 22.04 LTS
    cpu:
      model: AMD EPYC 9654
      cores: 48
      threads: 96
    memory: 256 GB
    disk:
      - mount: /
        size: 1 TB
        type: NVMe SSD
      - mount: /data
        size: 8 TB
        type: NVMe SSD
    gpu:
      - model: NVIDIA A100 80G
        count: 2
        vram: 80 GB
    services:
      - docker
      - kubernetes (worker)
    status: active
    notes: 生产环境工作节点

  - hostname: ai-storage-01
    role: storage
    ip: 192.168.1.210
    os: Ubuntu 22.04 LTS
    cpu:
      model: Intel Xeon Silver 4410Y
      cores: 12
      threads: 24
    memory: 64 GB
    disk:
      - mount: /
        size: 480 GB
        type: SSD
      - mount: /data
        size: 20 TB
        type: HDD RAID10
    services:
      - minio
      - nfs-server
    status: active
    notes: 对象存储与备份节点
